version: 2
updates:
  - package-ecosystem: npm
    directory: /typescript
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    groups:
      opentelemetry:
        patterns:
          - opentelemetry-*
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

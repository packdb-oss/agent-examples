version: 2
updates:
  - package-ecosystem: npm
    directory: /typescript
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    groups:
      opentelemetry:
        patterns:
          - opentelemetry-*
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

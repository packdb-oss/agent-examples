name: oss-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/oss-ci.yml
  audit:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/oss-security.yml
  candidate:
    needs: [checks, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: private-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive reviewed source and record its digest
        run: |
          mkdir dist
          git ls-tree -r HEAD > dist/inventory.txt
          git rev-parse HEAD > dist/commit.txt
          git archive --format=tar.gz --prefix=agent-examples/ -o dist/agent-examples.tar.gz HEAD
          (cd dist && sha256sum commit.txt inventory.txt agent-examples.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
